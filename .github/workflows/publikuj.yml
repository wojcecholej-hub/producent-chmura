# Producent: Instagram bez włączonego komputera. Co 5 minut sprawdza kolejkę i publikuje rolki o terminie.
name: publikuj
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
concurrency:
  group: publikuj
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  obrot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Obrót kolejki
        env:
          KLUCZ: ${{ secrets.KLUCZ }}
          META_TOKENY: ${{ secrets.META_TOKENY }}
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Warsaw
        run: |
          git config user.name "producent-chmura"
          git config user.email "producent-chmura@users.noreply.github.com"
          python publikuj.py
